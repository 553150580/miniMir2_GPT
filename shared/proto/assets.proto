syntax = "proto3";
package minimir.v1;
option go_package = "minimir/api/generated/minimirv1";
import "common.proto";

message WalletState {
  int64 gold = 1;
  int64 bound_gold = 2;
  int64 yuanbao_units = 3;
  int64 bound_yuanbao_units = 4;
  uint64 revision = 5;
}
message ItemView {
  bytes instance_id = 1;
  uint32 item_id = 2;
  int64 quantity = 3;
  bool bound = 4;
  uint64 version = 5;
  // 来源与品质属于物品实例，旧实例空来源保持未知，不反推成掉落。
  string source_kind = 6;
  string source_id = 7;
  uint32 quality = 8;
  bool locked = 9;
  // 强保护位：1锁定，2未确认培养结果，4资产占用，8穿戴中；客户端不可覆盖。
  uint32 recycle_block_flags = 10;
}
message EquippedItem { uint32 slot = 1; ItemView item = 2; }
// 已学技能属于永久成长；短冷却、施法与治疗队列不保存在此处。
message LearnedSkill { uint32 skill_id = 1; uint32 level = 2; }
message InventoryResult {
  repeated ItemView items = 1;
  uint32 capacity = 2;
  uint64 revision = 3;
  repeated EquippedItem equipped = 4;
  uint32 level = 5;
  int64 experience = 6;
  repeated LearnedSkill learned_skills = 7;
  AutoRecyclePolicy auto_recycle = 8;
  ProgressionState progression = 9;
}
// 只读永久成长观察；缺少目录或遗留超范围角色不凭数组长度猜上限。
message ProgressionState {
  uint32 format_version = 1;
  string curve_version = 2;
  uint32 level_cap = 3;
  uint32 rebirth_count = 4;
  int64 next_level_experience = 5;
  int64 pending_experience = 6;
  int64 pending_experience_limit = 7;
  int64 legacy_experience_overflow = 8;
  bool at_cap = 9;
  bool migration_required = 10;
  bool rebirth_enabled = 11;
  uint32 catalog_max_level = 12;
}
// 原SourceSeq确认后的经验分账；level_before/after只计本次新奖励引起的升级。
message ExperienceGrantResult {
  RoleKey role = 1;
  uint64 role_revision = 2;
  uint64 source_seq = 3;
  string curve_version = 4;
  int64 raw_experience = 5;
  int64 accepted_experience = 6;
  int64 pooled_experience = 7;
  int64 rejected_experience = 8;
  uint32 level_before = 9;
  uint32 level_after = 10;
  ProgressionState state = 11;
  bool migrated = 12;
  uint32 legacy_level_before = 13;
  uint32 legacy_level_after = 14;
  uint64 rule_version = 15;
}
// 永久角色设置，默认关闭。请求revision为期望旧值，成功后由owner递增。
// protected_item_ids是物品配置ID，按类型保护；max_required_level=0表示不限。
message AutoRecyclePolicy {
  bool enabled = 1;
  repeated uint32 quality_ids = 2;
  uint32 max_required_level = 3;
  repeated uint32 protected_item_ids = 4;
  bool protect_bound = 5;
  bool protect_unbound = 6;
  uint64 revision = 7;
}
// apply_existing须玩家明确确认；与设置同一事务，不自动开启战斗。
message SetAutoRecycleRequest {
  AutoRecyclePolicy policy = 1;
  bool apply_existing = 2;
  OperationContext operation = 3;
}
message SetItemLockRequest {
  bytes item_instance_id = 1;
  uint64 item_version = 2;
  bool locked = 3;
  OperationContext operation = 4;
}
// 只报告已经提交的原结果。trigger：1逐事件自动回收，2明确应用背包，3手动分解。
// 来源事件用source_seq，客户端操作用原16字节op_id；不从钱包差值推算。
message EquipmentRecycleResult {
  RoleKey role = 1;
  uint64 role_revision = 2;
  uint64 source_seq = 3;
  bytes op_id = 4;
  uint64 policy_revision = 5;
  uint64 recycled_count = 6;
  int64 gold = 7;
  int64 bound_gold = 8;
  uint64 discarded_count = 9;
  string discard_reason = 10;
  uint32 trigger = 11;
}
// 方向必须显式给出，不按是否已穿戴隐式切换；slot100仍由独立护符协议处理。
// rule22新操作同时核对原实例版本；旧请求/回执保留原字段与指纹，不补造版本。
message EquipRequest {
  bytes item_instance_id = 1;
  uint32 slot = 2;
  OperationContext operation = 3;
  bool unequip = 4;
  uint64 item_version = 5;
}
message RecycleRequest { repeated bytes item_instance_ids = 1; OperationContext operation = 2; }
// 药品只作用于原场景；永久消耗由角色owner确认，临时药效不持久化。
message UseItemRequest {
  bytes item_instance_id = 1;
  uint32 item_id = 2;
  uint64 scene_epoch = 3;
  OperationContext operation = 4;
}
message LearnSkillRequest {
  bytes item_instance_id = 1;
  uint32 skill_id = 2;
  OperationContext operation = 3;
}
// 护符属于独立消耗槽，不新增普通强化装备部位；装入与取下都核对原实例/版本。
message SetCastingSupplyRequest {
  bytes item_instance_id = 1;
  uint64 item_version = 2;
  bool unequip = 3;
  OperationContext operation = 4;
}
// 永久材料由角色owner先扣，再向原scene/life应用一次临时施法；重试保留原op。
message CastWithMaterialRequest {
  uint64 scene_epoch = 1;
  uint32 input_sequence = 2;
  uint32 skill_id = 3;
  uint32 target_handle = 4;
  GridPoint target_grid = 5;
  uint32 direction = 6;
  bytes material_instance_id = 7;
  uint64 material_version = 8;
  uint64 caster_life = 9;
  OperationContext operation = 10;
}
message ItemConsumption { bytes instance_id = 1; uint64 version = 2; int64 quantity = 3; }
// kind：1购书/书页，2技能升级，3技能书分解，4同源书页合并。预览不冻结资产。
// 合并保留原来源、绑定与品质；提交仍沿原报价及永久操作身份。
message SkillAssetPreviewRequest {
  uint32 kind = 1;
  uint32 offer_id = 2;
  int64 quantity = 3;
  uint32 skill_id = 4;
  repeated ItemConsumption materials = 5;
}
message SkillMaterialView { ItemView item = 1; int64 consume_quantity = 2; }
// key由服务端枚举白名单提供，显示基础威力/准确/耗蓝，不伪装最终伤害。
message SkillNumericComparison {
  string key = 1;
  int64 before_min = 2;
  int64 before_max = 3;
  int64 after_min = 4;
  int64 after_max = 5;
}
message SkillAssetPreview {
  bytes preview_id = 1;
  uint32 kind = 2;
  uint64 rule_version = 3;
  string config_hash = 4;
  uint64 role_revision = 5;
  uint64 expires_at_unix_ms = 6;
  uint32 skill_id = 7;
  uint32 from_level = 8;
  uint32 to_level = 9;
  WalletState spend = 10;
  repeated SkillMaterialView materials = 11;
  repeated ItemView outputs = 12;
  repeated SkillNumericComparison stats = 13;
  uint32 offer_id = 14;
  int64 quantity = 15;
}
message SkillAssetCommitRequest { bytes preview_id = 1; OperationContext operation = 2; }
message ClaimHostingTimeRequest { uint32 benefit_kind = 1; OperationContext operation = 2; }
message BuyHostingTimeRequest { uint32 requested_seconds = 1; OperationContext operation = 2; }
// 战报展示已提交收益，卡到期前后绑定分账；此消息不触发重抽或重判绑定。
message HostingReport {
  bytes hosting_session_id = 1;
  uint64 used_seconds = 2;
  uint64 kills = 3;
  int64 experience = 4;
  WalletState earned = 5;
  repeated ItemView drops = 6;
  uint32 stop_reason = 7;
  uint64 settlement_sequence = 8;
  uint64 recycle_count = 9;
  int64 recycle_gold = 10;
  int64 recycle_bound_gold = 11;
  uint64 discard_count = 12;
  string last_discard_reason = 13;
  // 本次托管原掉物总数；drops最多100条只是入包样本，不能作为总数。
  uint64 total_drop_count = 14;
  int64 raw_experience = 15;
  int64 rejected_experience = 16;
  int64 pooled_experience = 17;
}


// scope：1角色个人仓，2账号与永久入口共享仓。客户端不提供仓库归属键。
// 所有仓位从0开始，limit必须明确且不超过当前配置的分页窗口。
message WarehouseQuery { uint32 scope = 1; uint64 start_slot = 2; uint32 limit = 3; }
message WarehouseItem { uint64 slot = 1; ItemView item = 2; }
message WarehousePage {
  RoleKey role = 1;
  uint32 scope = 2;
  uint64 revision = 3;
  uint64 capacity = 4;
  uint64 start_slot = 5;
  uint32 limit = 6;
  repeated WarehouseItem items = 7;
  int64 gold = 8;
  int64 yuanbao_units = 9;
}
// action：1存物、2取物、3存币、4取币、5个人扩页；currency：1金币、2元宝整数单位。
// 存取物指定原完整实例及数量；不自动合并其它堆叠。其它动作必须清空无关字段。
message WarehouseAction {
  uint32 scope = 1;
  uint32 action = 2;
  uint64 warehouse_revision = 3;
  uint64 warehouse_slot = 4;
  bytes item_instance_id = 5;
  uint64 item_version = 6;
  int64 quantity = 7;
  uint32 currency = 8;
  int64 amount = 9;
  OperationContext operation = 10;
}
message WarehouseItemChange { uint64 slot = 1; ItemView before = 2; ItemView after = 3; }
// 仅已提交回执的事实，不从钱包差值猜结果；健康重入不补播历史。
// warehouse_revision/余额为原提交截面，客户端不得用旧回执覆盖较新的页面。
message WarehouseActionResult {
  RoleKey role = 1;
  uint64 role_revision = 2;
  bytes op_id = 3;
  uint32 scope = 4;
  uint32 action = 5;
  uint64 warehouse_revision = 6;
  uint64 capacity = 7;
  repeated WarehouseItemChange changes = 8;
  int64 gold = 9;
  int64 yuanbao_units = 10;
}
