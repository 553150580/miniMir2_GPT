syntax = "proto3";
package minimir.v1;
option go_package = "minimir/api/generated/minimirv1";
import "assets.proto";
import "common.proto";

// 从当前活动场景发起一次个人挑战，重复请求沿用同一挑战编号。
message PersonalBossEnter {
  uint64 scene_epoch = 1;
  string challenge_id = 2;
  uint32 template_id = 3;
}

// 使用原挑战身份申请中断和返回，不能指定收益或次数。
message PersonalBossLeave {
  uint64 scene_epoch = 1;
  string challenge_id = 2;
}

// 挑战进度由服务端核定，永久结果仅在角色所有者确认后下发。
message PersonalBossState {
  string challenge_id = 1;
  uint64 scene_epoch = 2;
  uint32 template_id = 3;
  // 1 预约，2 等待首基线确认，3 进行中，4 胜利，5 超时，6 中断，7 战败。
  uint32 state = 4;
  int64 expires_at_unix_ms = 5;
  uint32 error_code = 6;
}

// 查询当前角色的挑战资格和最近结算。
message PersonalBossQuery {}

message PersonalBossInfo {
  uint32 error_code = 1;
  bool open = 2;
  uint32 template_id = 3;
  string display_name = 4;
  uint64 map_id = 5;
  uint32 monster_id = 6;
  uint32 minimum_level = 7;
  string day = 8;
  uint32 successes = 9;
  uint32 daily_limit = 10;
  bool can_enter = 11;
  // 0 可开、1 未开放、2 等级不足、3 进行中、4 冷却、5 次数用完、6 场景不允许、7 背包已满、8 待领已满。
  uint32 eligibility_reason = 12;
  int64 available_at_unix_ms = 13;
  string active_challenge_id = 14;
  int64 active_expires_at_unix_ms = 15;
  repeated PersonalBossHistoryEntry history = 16;
  repeated ChallengePendingReward pending_rewards = 17;
  uint32 pending_reward_capacity = 18;
  repeated PersonalBossTemplateChoice templates = 19;
  // 世界奖励按永久角色查找，独立于个人首领奖励的容量。
  repeated ChallengePendingReward world_pending_rewards = 20;
  bool world_pending_rewards_more = 21;
  // 讨伐链的独立通关附件，永久保留原队员各自的抽取结果。
  repeated ChallengePendingReward dungeon_pending_rewards = 22;
  bool dungeon_pending_rewards_more = 23;
}

// 单个可选个人首领的入场资格；每日成功次数及活动场次仍为角色共用。
message PersonalBossTemplateChoice {
  uint32 template_id = 1;
  string display_name = 2;
  uint64 map_id = 3;
  uint32 monster_id = 4;
  uint32 minimum_level = 5;
  bool can_enter = 6;
  uint32 eligibility_reason = 7;
  int64 available_at_unix_ms = 8;
}

// 每笔待领对应已确认的原挑战。物品的实例、数量和绑定在挑战结算时冻结。
message ChallengePendingReward {
  bytes reward_id = 1;
  uint32 template_id = 2;
  int64 earned_at_unix_ms = 3;
  repeated ItemView items = 4;
  string source_kind = 5;
  uint32 source_rank = 6;
  // 镜像赛季结算冻结的绑定元宝，使用钱包最小单位。
  int64 bound_yuanbao_units = 7;
  // 世界场次冻结的魂兽，领取不消耗背包格。
  uint32 soul_type_id = 8;
  int64 soul_duplicate_fragments = 9;
}

// 领取整笔待领；库存不足时保留原记录。
message ClaimChallengeReward {
  bytes reward_id = 1;
  OperationContext operation = 2;
}

message PersonalBossHistoryEntry {
  string challenge_id = 1;
  uint32 template_id = 2;
  uint64 rule_version = 3;
  // 1 胜利、2 超时、3 中断、4 战败。
  uint32 outcome = 4;
  int64 finished_at_unix_ms = 5;
  int64 damage = 6;
  int64 hp_remaining = 7;
  bool recovered = 8;
  int64 reward_gold = 9;
  bool reward_bound = 10;
  uint32 soul_type_id = 11; // 已实际获得或折片的魂兽类型。
  int64 soul_fragments = 12; // 已经计入角色余额的折片数量，零为取得首只。
}
