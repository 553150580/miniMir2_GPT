syntax = "proto3";
package minimir.v1;
option go_package = "minimir/api/generated/minimirv1";

// 背包、穿戴、报价和回执共用的权威实例快照。
message ItemView {
  bytes instance_id = 1;
  uint32 item_id = 2;
  int64 quantity = 3;
  bool bound = 4;
  uint64 version = 5;
  // 来源与品质属于物品实例，旧实例空来源保持未知。
  string source_kind = 6;
  string source_id = 7;
  uint32 quality = 8;
  bool locked = 9;
  // 强保护位：1 锁定、2 未确认培养、4 资产占用、8 穿戴中。
  uint32 recycle_block_flags = 10;
  // 耐久单位为 1/1000，原始上限非零时当前值 0 表示损坏。
  uint64 durability_u = 11;
  uint64 max_durability_u = 12;
  uint64 original_durability_u = 13;
  // 矿石纯度为 1 至 100，0 表示无纯度。
  uint32 ore_purity = 14;
  // 装备取得时的原初始幸运，培养后仍保留原值。
  uint32 initial_luck = 15;
  // 服务端校验的当前幸运，旧实例使用其原初始幸运。
  uint32 current_luck = 16;
  // 已采纳的词条跟随原装备，空槽保持缺省。
  repeated EquipmentRefineAffix refine_affixes = 17;
  // 已付费的最新待选结果只供原装备所有者观察和处理。
  EquipmentRefinePending refine_pending = 18;
}

// 词条归同一装备位置，开发候选以十分之一表示固定属性。
message EquipmentRefineAffix {
  uint32 slot = 1;
  uint32 attribute_id = 2;
  uint32 tier = 3;
  int64 value_units = 4;
}

// 已付费待选不随报价到期失效，采纳或放弃都需要原编号。
message EquipmentRefinePending {
  bytes pending_id = 1;
  repeated EquipmentRefineAffix affixes = 2;
  repeated uint32 locked_slots = 3;
}
