syntax = "proto3";
package minimir.v1;
option go_package = "minimir/api/generated/minimirv1";
import "common.proto";

// 本地口令仅经TLS发送，不进入日志；第三方登录在平台接入阶段另定义验证字段。
message LocalLoginRequest { string account = 1; string password = 2; }
message LoginResult { bytes account_id = 1; string account_token = 2; uint64 expires_at_unix = 3; }
message RoleDirectoryRequest { uint64 origin_server_id = 1; }
message RoleSummary {
  RoleKey key = 1;
  string name = 2;
  uint32 job = 3;
  uint32 gender = 4;
  uint32 level = 5;
  uint32 slot = 6;
  uint64 appearance_version = 7;
}
message RoleDirectoryResult { repeated RoleSummary roles = 1; uint64 route_version = 2; }
message CreateRoleRequest { uint64 origin_server_id = 1; uint32 slot = 2; uint32 job = 3; string name = 4; bytes op_id = 5; }
message EntryTicketRequest { RoleKey role = 1; }
message EntryTicketResult {
  string ticket = 1;
  string game_wss_url = 2;
  uint64 run_server_id = 3;
  uint64 route_version = 4;
  uint64 expires_at_unix = 5;
}

