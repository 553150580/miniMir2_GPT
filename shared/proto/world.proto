syntax = "proto3";
package minimir.v1;
option go_package = "minimir/api/generated/minimirv1";
import "common.proto";

message EnterLineRequest { string account_ticket = 1; }
message EnterLineResult {
  uint64 scene_epoch = 1;
  uint64 baseline_id = 2;
  uint64 room_id = 3;
  uint32 line_id = 4;
  uint64 resource_version = 5;
  GridPoint position = 6;
  uint32 scene_kind = 7;
  uint64 next_economic_command_seq = 8;
}
message EnterWorldAck { uint64 scene_epoch = 1; uint64 baseline_id = 2; }
// 仅在当前场景基线ACK验证成功后发送，客户端据此恢复经济命令序号。
message SyncReady { uint64 scene_epoch = 1; uint64 baseline_id = 2; uint64 next_economic_command_seq = 3; }
message EntityState {
  uint32 entity_handle = 1;
  uint32 entity_kind = 2;
  uint32 definition_id = 3;
  GridPoint position = 4;
  uint32 direction = 5;
  int64 hp = 6;
  int64 hp_max = 7;
  uint32 action = 8;
  int64 mp = 9;
  int64 mp_max = 10;
  // 纯观察字段：当前实体实际移动间隔，0表示不适用；不改变战斗参数。
  uint32 move_interval_ms = 11;
  // 每次受理攻击递增，独立于可能被受击覆盖的action；初始为0。
  uint32 attack_sequence = 12;
  uint32 cast_sequence = 13;
  uint32 cast_skill_id = 14;
  // 出生代次和当前实际攻击间隔只用于观察，不能由客户端授予。
  uint64 life = 15;
  uint32 attack_interval_ms = 16;
  uint32 attack_skill_id = 17;
  uint32 attack_skill_level = 18;
  // 当前生命的权威状态全量；空列表清除，剩余时间为0不等于客户端可自行移除。
  repeated EntityStatusState statuses = 19;
  CombatAttributes combat_attributes = 20;
}
message EntityStatusState {
  uint32 status_id = 1;
  uint32 source_skill_id = 2;
  uint32 skill_level = 3;
  uint32 remaining_ms = 4;
  int64 max_physical_defence_bonus = 5;
  int64 max_magic_defence_bonus = 6;
  uint32 damage_reduction_percent = 7;
  uint32 caster_handle = 8;
  uint64 caster_life = 9;
}
// 纯观察值：含已生效临时状态，客户端不据此重新计算命中或修改伤害。
message CombatAttributes {
  int64 physical_attack_min = 1;
  int64 physical_attack_max = 2;
  int64 physical_defence_min = 3;
  int64 physical_defence_max = 4;
  int64 magic_defence_min = 5;
  int64 magic_defence_max = 6;
  int64 magic_attack_min = 7;
  int64 magic_attack_max = 8;
  int64 spirit_attack_min = 9;
  int64 spirit_attack_max = 10;
  int64 accuracy = 11;
  int64 agility = 12;
  uint32 damage_reduction_percent = 13;
}
message SceneBaselineChunk {
  uint64 scene_epoch = 1;
  uint64 baseline_id = 2;
  uint32 chunk_index = 3;
  uint32 chunk_count = 4;
  uint64 state_sequence = 5;
  repeated EntityState entities = 6;
  SkillModeState skill_mode_state = 7;
}
message MoveIntent { uint64 scene_epoch = 1; uint32 input_sequence = 2; GridPoint destination = 3; uint32 direction = 4; bool release_joystick = 5; }
message CastIntent { uint64 scene_epoch = 1; uint32 input_sequence = 2; uint32 skill_id = 3; uint32 target_handle = 4; GridPoint target_grid = 5; uint32 direction = 6; }
// 近战按受理时的逻辑朝向取格；skill_id为0时由权威模式选技，其它值只校验预期。
message AttackIntent { uint64 scene_epoch = 1; uint32 input_sequence = 2; uint32 direction = 3; uint32 skill_id = 4; }
message SkillModeIntent { uint64 scene_epoch = 1; uint32 input_sequence = 2; uint32 skill_id = 3; bool enabled = 4; }
message SkillModeEntry {
  uint32 skill_id = 1;
  bool enabled = 2;
  bool ready = 3;
  uint32 remaining_ms = 4;
  uint32 cooldown_remaining_ms = 5;
}
// 临时内存状态；剩余时间只供显示，客户端倒计时不能授予准备状态。
message SkillModeState {
  uint64 scene_epoch = 1;
  uint64 revision = 2;
  repeated SkillModeEntry states = 3;
  uint64 player_life = 4;
  uint64 server_time_unix_ms = 5;
}
// 只观察实际已推进的传播格；空有效格也发，阻挡格不发，不在基线重播旧步。
message CastStep {
  uint64 scene_epoch = 1;
  uint64 cast_id = 2;
  uint32 skill_id = 3;
  uint32 caster_handle = 4;
  uint64 caster_life = 5;
  GridPoint grid = 6;
  uint32 direction = 7;
  uint32 step_index = 8;
  uint32 skill_level = 9;
}
// 只描述本次已确认的临时施法；基线不重放旧投射物或命中特效。
message CastAccepted {
  uint64 scene_epoch = 1;
  uint64 cast_id = 2;
  uint32 skill_id = 3;
  uint32 caster_handle = 4;
  uint32 target_handle = 5;
  GridPoint origin = 6;
  GridPoint target_grid = 7;
  uint32 direction = 8;
  uint32 delay_ms = 9;
  uint32 input_sequence = 10;
  uint64 caster_life = 11;
  uint64 target_life = 12;
  uint32 skill_level = 13;
}
// 普通攻击受理与到期结算分开，身体动作不代替实际命中结果。
message AttackAccepted {
  uint64 scene_epoch = 1;
  uint64 event_id = 2;
  uint32 caster_handle = 3;
  uint32 target_handle = 4;
  GridPoint origin = 5;
  GridPoint target_grid = 6;
  uint32 direction = 7;
  uint32 delay_ms = 8;
  uint32 attack_sequence = 9;
  uint32 input_sequence = 10;
  uint32 skill_id = 11;
  uint32 skill_level = 12;
  uint64 caster_life = 13;
}
// outcome：1命中、2闪避或抵抗、3原目标失效、4加入治疗队列；4不是立即恢复HP。
message CombatImpact {
  uint64 scene_epoch = 1;
  uint64 event_id = 2;
  uint32 skill_id = 3;
  uint32 caster_handle = 4;
  uint32 target_handle = 5;
  uint64 target_life = 6;
  GridPoint target_grid = 7;
  int64 amount = 8;
  uint32 outcome = 9;
  bool healing = 10;
  uint64 cast_id = 11;
  uint32 attack_sequence = 12;
}
message AutoBattleIntent { uint64 scene_epoch = 1; bool enabled = 2; uint32 monster_count = 3; }
message HostingState { uint32 remain_hosting_sec = 1; bool auto_battle_enabled = 2; uint64 state_revision = 3; }
message DeathNotice {
  bytes death_id = 1;
  uint32 cause_code = 2;
  uint32 allowed_actions = 3;
  int64 inplace_price_yuanbao_units = 4;
  uint64 rule_version = 5;
}
message ReviveChoice { bytes death_id = 1; uint32 action = 2; OperationContext operation = 3; }

