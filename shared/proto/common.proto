syntax = "proto3";
package minimir.v1;
option go_package = "minimir/api/generated/minimirv1";

import "item_view.proto";

// 永久ID采用128位字节；长度由服务端校验，高频实体使用场景内uint32句柄。
message RoleKey { bytes role_id = 1; uint64 origin_server_id = 2; }
message GridPoint { sint32 x = 1; sint32 y = 2; }
message OperationContext {
  bytes op_id = 1;
  uint64 command_seq = 2;
  uint64 expected_revision = 3;
  uint64 expected_rule_version = 4;
}
message OperationResult {
  bytes op_id = 1;
  uint64 command_seq = 2;
  uint64 new_revision = 3;
  uint32 error_code = 4;
  bool pending = 5;
  HostingPurchaseReceipt hosting_purchase = 6;
  MirrorArenaExchangeReceipt mirror_arena_exchange = 7;
  RoleCardPurchaseReceipt role_card_purchase = 8;
  RoleCardDailyReceipt role_card_daily = 9;
  ItemMarketReceipt item_market = 10;
  GoldMarketReceipt gold_market = 11;
  ForgeReceipt forge = 12;
  WeaponOilReceipt weapon_oil = 13;
  RecycleOilReceipt recycle_oil = 14;
  WingReceipt wing = 15;
  EquipmentEnhancementReceipt equipment_enhancement = 16;
  EquipmentRefineReceipt equipment_refine = 17;
  RecycleRefineReceipt recycle_refine = 18;
  MedalReceipt medal = 19;
  RebirthReceipt rebirth = 20;
  BodyTrainingReceipt body_training = 21;
}

// 各系的永久等级随同一角色库存修订下发。
message BodyTrainingState {
  uint32 health_level = 1;
  uint32 mana_level = 2;
  uint32 damage_level = 3;
  uint32 absorption_level = 4;
  uint32 critical_level = 5;
  uint32 speed_level = 6;
  uint32 resistance_level = 7;
}

// 本次原费用、成功率和额度。实际战斗加成仍受统一属性预算。
message BodyTrainingTerms {
  uint32 track = 1;
  uint32 before_level = 2;
  uint32 target_level = 3;
  uint32 success_ppm = 4;
  int64 gold = 5;
  int64 bound_gold = 6;
  int64 before_bonus = 7;
  int64 target_bonus = 8;
  // 元宝用十分之一元宝的整数单位下发。原四个金币系仍使用字段 5、6。
  int64 yuanbao_units = 9;
  int64 bound_yuanbao_units = 10;
}

// 成功与概率失败都记录原费用和确定的后级，供重连恢复。
message BodyTrainingReceipt {
  bytes quote_id = 1;
  BodyTrainingTerms terms = 2;
  bool success = 3;
  uint32 after_level = 4;
}

// 原绑定道具实例和实际扣量。
message RebirthSpend {
  bytes instance_id = 1;
  uint32 item_id = 2;
  uint64 version = 3;
  int64 quantity = 4;
}

// 原转生档位、实际等级与待用经验释放结果。
message RebirthTransition {
  uint32 previous_cap = 1;
  uint32 new_cap = 2;
  uint32 previous_level = 3;
  uint32 new_level = 4;
  uint32 new_count = 5;
  int64 released_experience = 6;
  int64 new_experience = 7;
}

// 完整扣款、凭证来源及成长结果，供原操作重放。
message RebirthReceipt {
  bytes quote_id = 1;
  RebirthTransition transition = 2;
  bytes challenge_id = 3;
  RebirthSpend credential = 4;
  repeated RebirthSpend materials = 5;
  int64 gold = 6;
  int64 bound_gold = 7;
}

// 角色独立勋章的永久等级与版本；未激活时不发送状态。
message MedalState {
  uint32 level = 1;
  uint64 version = 2;
}

// 原碎片堆确认时的版本、实际扣量和绑定状态。
message MedalFragmentSpend {
  bytes instance_id = 1;
  uint64 version = 2;
  int64 quantity = 3;
  bool bound = 4;
}

// 必成升档的原回执，记录激活前或升档前的级别。
message MedalReceipt {
  bytes quote_id = 1;
  uint32 before_level = 2;
  MedalState medal = 3;
  repeated MedalFragmentSpend fragments = 4;
}
// 洗炼确切消耗的原石堆，保留扣前版本、数量和绑定。
message EquipmentRefineSpend {
  ItemView item = 1;
  int64 quantity = 2;
}
// 原洗炼流水的结果。生成有消费，采纳与放弃只移除对应待选。
message EquipmentRefineReceipt {
  uint32 action = 1;
  ItemView target = 2;
  bool equipped = 3;
  bytes quote_id = 4;
  bytes pending_id = 5;
  repeated EquipmentRefineSpend stones = 6;
  int64 gold = 7;
  int64 bound_gold = 8;
  int64 yuanbao_units = 9;
  int64 bound_yuanbao_units = 10;
}
// 分解事务确认的洗炼石。未命中时仍可复核原装备，石字段缺省。
message RecycleRefineReceipt {
  repeated RecycleRefineRoll rolls = 1;
}
message RecycleRefineRoll {
  bytes equipment_instance_id = 1;
  ItemView stone = 2;
}
// 部位等级归角色所有，装备替换和卸下均不改变它。
message EquipmentEnhancementSlot {
  uint32 slot = 1;
  uint32 level = 2;
}
// 结算只消耗这些原石堆，不扣钱包，也不改穿戴装备的绑定。
message EquipmentEnhancementStoneSpend {
  ItemView item = 1;
  int64 quantity = 2;
}
// 失败同样确认原投入，等级保持；重放返回首次确认的原结果。
message EquipmentEnhancementReceipt {
  bytes quote_id = 1;
  uint32 slot = 2;
  uint32 before_level = 3;
  uint32 after_level = 4;
  bool success = 5;
  repeated EquipmentEnhancementStoneSpend stones = 6;
}
// 一名角色永久拥有的同一个翅膀实例。隐藏外观仍保持全部属性。
message WingState {
  bytes wing_id = 1;
  uint32 rank = 2;
  uint32 appearance_tier = 3;
  bool hidden = 4;
  uint32 luck = 5;
  uint32 oil_to_six = 6;
  uint32 oil_to_nine = 7;
  uint64 version = 8;
}
message WingFeatherSpend {
  // 实际消费前的原羽毛堆叠。
  ItemView item = 1;
  int64 quantity = 2;
}
// 同一原操作重放首次确认的翅膀和羽毛。动作 2 只变更外观。
message WingReceipt {
  uint32 action = 1;
  WingState wing = 2;
  bytes quote_id = 3;
  repeated WingFeatherSpend feathers = 4;
}
// 手动分解原件时的已确认祝福油判定。未命中的原件保留抽样记录。
message RecycleOilReceipt {
  repeated RecycleOilRoll rolls = 1;
}
message RecycleOilRoll {
  bytes equipment_instance_id = 1;
  uint32 luck = 2;
  // 仅在命中时返回已发放的一瓶原油，不暴露随机值。
  ItemView oil = 3;
}
// 只在实际扣除一瓶祝福油后出现。失败与回退也返回原武器及消耗前的原油堆。
message WeaponOilReceipt {
  bytes quote_id = 1;
  ItemView weapon = 2;
  ItemView oil = 3;
  bool equipped = 4;
  uint32 before_luck = 5;
  bool success = 6;
  bool guaranteed = 7;
  uint32 pity_used = 8;
  uint32 pity_after = 9;
  // 操作翅膀时返回同一原实例，武器字段缺省。
  WingState wing = 10;
}
// 首次创建的装备身份和原绑定状态，原回执重放时保持不变。
message ForgeOutput {
  bytes instance_id = 1;
  uint32 item_id = 2;
  bool bound = 3;
  uint32 quality = 4;
  uint32 initial_luck = 5;
}
// 实际完成判定才出现锻造回执；未成功也按原报价扣矿和金币，图纸保留。
message ForgeReceipt {
  bytes quote_id = 1;
  bool success = 2;
  ForgeOutput output = 3;
  int64 gold = 4;
  int64 bound_gold = 5;
}
// 金币市场回执确认原委托、托管或撤单。挂单只确认首次冻结和活动委托，成交由撮合账本推进。
message GoldMarketReceipt {
  uint32 action = 1;
  bytes order_id = 2;
  uint64 order_version = 3;
  uint32 side = 4;
  uint32 state = 5;
  int64 quantity_lots = 6;
  int64 filled_lots = 7;
  int64 remaining_lots = 8;
  int64 unit_price_yuanbao_units = 9;
  int64 gold_delta = 10;
  int64 yuanbao_delta_units = 11;
  int64 seller_fee_yuanbao_units = 12;
  bytes escrow_id = 13;
  uint64 escrow_version = 14;
  int64 expires_at_unix_ms = 15;
}
// 道具市场永久回执引用实际订单、数量与角色非绑定元宝变化，保留首次确认结果。
message ItemMarketReceipt {
  uint32 action = 1;
  bytes order_id = 2;
  uint64 order_version = 3;
  uint32 item_id = 4;
  int64 quantity = 5;
  int64 unit_price_yuanbao_units = 6;
  int64 yuanbao_delta_units = 7;
  int64 tax_yuanbao_units = 8;
  bytes escrow_id = 9;
  uint64 escrow_version = 10;
}
// 兑换只按服务端权威价格成交。同一原操作重放返回首次扣分与原绑定羽毛。
message MirrorArenaExchangeReceipt {
  int64 spent_points = 1;
  int64 remaining_points = 2;
  bytes item_instance_id = 3;
  uint32 item_id = 4;
  int64 quantity = 5;
}
// 报价冻结规则、档位、时长和两个钱包的扣款；仅成功的实时报价携带报价身份。
message HostingQuoteResult {
  bytes quote_id = 1;
  uint64 scene_epoch = 2;
  uint64 role_revision = 3;
  uint64 rule_version = 4;
  string config_hash = 5;
  uint64 quote_version = 6;
  uint32 band_min_level = 7;
  uint32 band_max_level = 8;
  uint32 granularity_seconds = 9;
  uint32 requested_seconds = 10;
  int64 reference_gold_per_hour = 11;
  int64 gold_per_hour = 12;
  int64 total_gold = 13;
  int64 before_seconds = 14;
  int64 bound_gold_cost = 15;
  int64 gold_cost = 16;
  int64 expires_at_unix_ms = 17;
  uint32 error_code = 18;
}
// 成交回执保留原报价及到账快照，用于同一操作的持久重放。
message HostingPurchaseReceipt { HostingQuoteResult quote = 1; int64 balance_seconds = 2; }
// 卡商品只公布已开放的款式、有效天数和非绑元宝报价单位。
message RoleCardProductView {
  uint32 product_id = 1;
  uint32 kind = 2;
  uint32 days = 3;
  int64 price_yuanbao_units = 4;
}
// 原报价冻结角色当时卡有效期及规则身份，确认购买时回传同一报价编号。
message RoleCardQuoteView {
  bytes quote_id = 1;
  RoleCardProductView product = 2;
  uint64 rule_version = 3;
  string config_hash = 4;
  int64 expires_at_unix_ms = 5;
  int64 previous_until_unix_ms = 6;
}
// 购买回执保留首次确认时的报价、生效区间和付款账户余额。
message RoleCardPurchaseReceipt {
  RoleCardQuoteView quote = 1;
  int64 effective_at_unix_ms = 2;
  int64 new_until_unix_ms = 3;
  int64 yuanbao_balance_units = 4;
}
// 日领回执按上海运营日确认原绑定元宝及首次到账余额。
message RoleCardDailyReceipt {
  string operating_day = 1;
  int64 granted_units = 2;
  int64 bound_yuanbao_balance_units = 3;
  int64 accepted_at_unix_ms = 4;
}
message Heartbeat { uint64 client_monotonic_ms = 1; }
message HeartbeatResult { uint64 server_unix_ms = 1; }
// 批次内每项为带msg_id/request_seq/binding_epoch等头的完整应用body。
message Batch { repeated bytes application_bodies = 1; }
message ConfigVersion {
  uint64 rule_version = 1;
  string content_hash = 2;
  uint64 resource_version = 3;
  uint32 protocol_version = 4;
}

