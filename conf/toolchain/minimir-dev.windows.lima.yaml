# Windows 独立 Linux VM；QEMU 软件加速，不修改 Windows 功能、不开启开机启动。
minimumLimaVersion: "2.2.1"
vmType: "qemu"
arch: "x86_64"
cpus: 2
vmOpts:
  qemu:
    cpuType:
      x86_64: "max"
memory: "3GiB"
disk: "20GiB"
images:
  - location: "@VERIFIED_IMAGE@"
    arch: "x86_64"
    digest: "sha256:b3296484e362ba2e713489a5de6225c719d9500962bde25d15f2f21e512c7658"
mounts: []
mountType: "reverse-sshfs"
networks: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  overVsock: false
portForwards:
  - guestIP: "127.0.0.1"
    guestPort: 27017
    hostIP: "127.0.0.1"
    hostPort: 27118
    proto: "tcp"
  - guestIP: "0.0.0.0"
    guestPortRange: [1, 65535]
    proto: "any"
    ignore: true
upgradePackages: false
propagateProxyEnv: false
provision: []
